<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Tuote katalogi</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #334155;
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: #f8fafc;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e293b;
            font-size: 22px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-top: 35px;
            letter-spacing: -0.5px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            margin-top: 6px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }


        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        th {
            background-color: #1e293b;
            color: #f8fafc;
            text-align: left;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            font-size: 15px;
        }

    </style>
</head>
<body>
    <label for="name">Nimi:</label>
    <input type="text" id="name">
    
    <label for="price">Hinta:</label>
    <input type="text" id="price">

    <button onclick="addProduct()">Lisää</button>

    <h1>Tuotekatalogi</h1>
    <table>
        <thead>
        <tr>
            <th>Nimi</th>
            <th>Hinta</th>
        </tr>
        </thead>
        <tbody id="productList"></tbody>
    </table>

    <div id="tuotelista"></div>
    <script src="script.js"></script>
</body>

</html>
